
name: CodeQL Security Analysis

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-java:
    name: CodeQL Java (Mod + Aether)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          dependency-caching: true

      - name: Compile Minecraft mod and standalone Aether gateway
        run: |
          ./gradlew compileJava :aether-server:compileJava \
            -PcodexBuildDir=.codeql-build \
            --no-daemon --console=plain --max-workers=1 --rerun-tasks --no-build-cache

      - name: Analyze Java
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-java

  qodana:
    name: Qodana JVM Community
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan with Qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          linter: jetbrains/qodana-jvm-community
          results-dir: ${{ runner.temp }}/qodana/results
          upload-result: true
          post-pr-comment: false
          use-annotations: false
          push-fixes: none

      - name: Upload Qodana SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana-jvm

  codeql-actions:
    name: CodeQL GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL for GitHub Actions
        uses: github/codeql-action/init@v4
        with:
          languages: actions

      - name: Analyze GitHub Actions workflows
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-actions
