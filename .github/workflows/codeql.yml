
name: CodeQL Security Analysis

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-java:
    name: CodeQL Java (Mod + Aether)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          dependency-caching: true
          config-file: ./codeql-config.yml

      - name: Compile Minecraft mod and standalone Aether gateway
        run: |
          ./gradlew compileJava :aether-server:compileJava \
            -PcodexBuildDir=.codeql-build \
            --no-daemon --console=plain --max-workers=1 --rerun-tasks --no-build-cache

      - name: Analyze Java
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-java

  qodana:
    name: Qodana JVM Community
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan with Qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          # Pin the published 2026.2 image so inspection changes are deliberate.
          args: --image,jetbrains/qodana-jvm-community:2026.2@sha256:a70ebaff842ac21bd1f0e53852e9d0dba950fe1a924c55666bdd50c21ac55a93
          # Recheck the complete project after bootstrap; old cached resolutions
          # and a previous commit's findings must not hide configuration changes.
          use-caches: false
          pr-mode: false
          results-dir: ${{ runner.temp }}/qodana/results
          upload-result: true
          post-pr-comment: false
          use-annotations: false
          push-fixes: none

      - name: Set up Node.js for report tagging
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test Qodana report scripts
        run: node --test .github/scripts/*.test.mjs

      - name: Tag performance inspections for GitHub filtering
        run: |
          node .github/scripts/tag-qodana-performance.mjs \
            "$RUNNER_TEMP/qodana/results/qodana.sarif.json" \
            "$RUNNER_TEMP/qodana/results/qodana.github.sarif.json"
          echo '[Performance alerts](https://github.com/Thunderrock424242/Wilderness-Odyssey-API/security/code-scanning?query=is%3Aopen%20branch%3Ain-dev%20tag%3Aperformance)' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Qodana SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.github.sarif.json
          category: qodana-jvm

      # Upload findings first so an unhealthy analysis remains available to inspect.
      - name: Check Qodana analysis health
        run: node .github/scripts/check-qodana-health.mjs "$RUNNER_TEMP/qodana/results/qodana.sarif.json"

  codeql-actions:
    name: CodeQL GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL for GitHub Actions
        uses: github/codeql-action/init@v4
        with:
          languages: actions

      - name: Analyze GitHub Actions workflows
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-actions
