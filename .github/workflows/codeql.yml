name: CodeQL Security Analysis

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  codeql-java:
    name: CodeQL Java
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          dependency-caching: true

      - name: Compile project for CodeQL
        run: ./gradlew compileJava -PcodexBuildDir=.codeql-build --no-daemon --console=plain --max-workers=1

      - name: Analyze Java
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-java

  qodana:
    name: Qodana JVM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Inspect with Qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          linter: jetbrains/qodana-jvm-community
          results-dir: ${{ runner.temp }}/qodana/results
          upload-result: true

      - name: Upload Qodana SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana-jvm

  codeql-actions:
    name: CodeQL Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL for workflows
        uses: github/codeql-action/init@v4
        with:
          languages: actions

      - name: Analyze workflows
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-actions
