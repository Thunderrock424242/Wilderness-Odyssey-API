
name: Build and Run Server

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        id: java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        id: gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify smoke monitor regressions
        id: harness
        run: node --test .github/scripts/ci-smoke.test.mjs

      - name: Build and verify server world load and shutdown
        id: smoke
        run: node .github/scripts/ci-smoke.mjs server

      - name: Write server report
        if: always() && steps.checkout.outcome == 'success'
        env:
          CI_STEP_OUTCOMES: '{"java":"${{ steps.java.outcome }}","gradle":"${{ steps.gradle.outcome }}","harness":"${{ steps.harness.outcome }}","smoke":"${{ steps.smoke.outcome }}"}'
        run: node .github/scripts/ci-smoke.mjs report server

      - name: Upload server diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: server-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .codex-build/reports/ci-server/
            .codex-build/run-ci-server/logs/
            .codex-build/run-ci-server/crash-reports/
            .codex-build/reports/tests/
            .codex-build/test-results/
            aether-server/.codex-build/reports/tests/
            aether-server/.codex-build/test-results/
            tools/structure-viewer/.codex-build/reports/tests/
            tools/structure-viewer/.codex-build/test-results/
            **/hs_err_pid*.log
