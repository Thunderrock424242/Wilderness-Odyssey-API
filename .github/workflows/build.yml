name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Refresh StructureGen content catalog
        run: ./gradlew runData -PcodexBuildDir=.ci-build --no-daemon --console=plain

      - name: Run focused StructureGen tests
        run: ./gradlew structureGenTest -PcodexBuildDir=.ci-build --no-daemon --console=plain

      - name: Run tests and build release artifact
        run: ./gradlew build -PcodexBuildDir=.ci-build --no-daemon --console=plain

      - name: Verify generators did not modify tracked sources
        run: git diff --exit-code
