name: Game Tests

on:
  pull_request:
  push:
    branches:
      - main
      - in-dev
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/gametest.yml'
  workflow_dispatch:

concurrency:
  group: gametest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rungametestserver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle packages
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Run GameTests
        run: ./gradlew runGameTestServer -PcodexBuildDir=.ci-build --no-daemon --no-parallel --console=plain --stacktrace