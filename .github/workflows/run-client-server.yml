name: Build and Run Client and Server

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-client-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: run-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [client, server]
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        id: java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        id: gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install software display support
        id: display
        if: matrix.target == 'client'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libopenal1

      - name: Verify smoke monitor regressions
        id: harness
        run: node --test .github/scripts/ci-smoke.test.mjs

      - name: Build and verify ${{ matrix.target }} startup and shutdown
        id: smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: node .github/scripts/ci-smoke.mjs ${{ matrix.target }}

      - name: Write ${{ matrix.target }} report
        if: always() && steps.checkout.outcome == 'success'
        env:
          CI_STEP_OUTCOMES: '{"java":"${{ steps.java.outcome }}","gradle":"${{ steps.gradle.outcome }}","display":"${{ steps.display.outcome }}","harness":"${{ steps.harness.outcome }}","smoke":"${{ steps.smoke.outcome }}"}'
        run: node .github/scripts/ci-smoke.mjs report ${{ matrix.target }}

      - name: Upload ${{ matrix.target }} diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .codex-build/reports/ci-${{ matrix.target }}/
            .codex-build/run-ci-${{ matrix.target }}/logs/
            .codex-build/run-ci-${{ matrix.target }}/crash-reports/
            .codex-build/reports/tests/
            .codex-build/test-results/
            aether-server/.codex-build/reports/tests/
            aether-server/.codex-build/test-results/
            tools/structure-viewer/.codex-build/reports/tests/
            tools/structure-viewer/.codex-build/test-results/
            **/hs_err_pid*.log
