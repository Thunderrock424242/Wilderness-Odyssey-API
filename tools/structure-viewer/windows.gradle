// Native packaging is opt-in and never participates in the production mod's build or dependencies.
def appName = 'Wilderness Structure Viewer'
def appVersion = providers.gradleProperty('viewerVersion').getOrElse('1.0.4')
// Keep this identity unchanged so Windows recognizes every release as the same installed product.
def upgradeUuid = '27ef4c02-4acd-4711-b59a-0cda1f8d2146'
def nativeRoot = layout.buildDirectory.dir('windows')
def installerWork = nativeRoot.map { it.dir("installer-work/${appVersion}") }
def imageRoot = nativeRoot.map { it.dir('image') }
def imageDir = imageRoot.map { it.dir(appName) }
def inputDir = nativeRoot.map { it.dir('input') }
def iconFile = nativeRoot.map { it.file('viewer.ico') }
def packagingJdk = providers.gradleProperty('viewerPackagingJdk').orElse(
        javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
                .map { it.metadata.installationPath.asFile.absolutePath })
def runtimeDir = providers.gradleProperty('viewerRuntimeDir')
def wixDir = providers.gradleProperty('viewerWixDir')

tasks.withType(JavaExec).configureEach { systemProperty 'structureViewer.version', appVersion }

// jpackage requires fresh output. Only delete the exact owned image subtree inside this build directory.
def clearImageOutput = {
    def target = imageRoot.get().asFile.canonicalFile.toPath()
    def owner = layout.buildDirectory.get().asFile.canonicalFile.toPath()
    if (!target.startsWith(owner) || target == owner) throw new GradleException('Unsafe native image output path')
    delete(target.toFile())
}

tasks.register('stageWindowsApp', Sync) {
    dependsOn jar
    into inputDir
    from(tasks.named('jar'))
    from(configurations.runtimeClasspath)
    from('src/bundle')
    from(rootProject == project ? '../../LICENSE.md' : rootProject.file('LICENSE.md')) { rename { 'WildernessOdyssey-LICENSE.txt' } }
}
tasks.register('windowsIcon', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.thunder.wildernessodysseyapi.tools.structureviewer.packaging.LauncherIcon'
    args iconFile.get().asFile.absolutePath
    outputs.file(iconFile)
}
tasks.register('windowsAppImage', Exec) {
    group = 'Wilderness Odyssey Tools'
    description = 'Creates the Windows application with its own Java runtime.'
    dependsOn stageWindowsApp, windowsIcon
    inputs.dir(inputDir)
    inputs.file(iconFile)
    inputs.property('appVersion', appVersion)
    inputs.property('packagingJdk', packagingJdk)
    inputs.property('runtimeDir', runtimeDir.orElse('jpackage default Java 21 runtime'))
    if (runtimeDir.isPresent()) inputs.file(file(runtimeDir.get()).toPath().resolve('release'))
    outputs.dir(imageDir)
    doFirst {
        if (!System.getProperty('os.name').startsWith('Windows')) throw new GradleException('Build Windows packages on Windows.')
        def jdk = file(packagingJdk.get())
        def release = new Properties(); file("${jdk}/release").withInputStream { release.load(it) }
        if (!release.getProperty('JAVA_VERSION', '').startsWith('"21.')) throw new GradleException('viewerPackagingJdk must be JDK 21.')
        clearImageOutput()
        def command = [new File(jdk, 'bin/jpackage.exe').absolutePath,
                '--type', 'app-image', '--name', appName, '--app-version', appVersion,
                '--input', inputDir.get().asFile.absolutePath, '--dest', imageRoot.get().asFile.absolutePath,
                '--main-jar', tasks.named('jar').get().archiveFileName.get(),
                '--main-class', application.mainClass.get(), '--icon', iconFile.get().asFile.absolutePath,
                '--java-options', '-Xmx2g', '--java-options', "-DstructureViewer.version=${appVersion}", '--vendor', 'Wilderness Odyssey',
                '--description', 'Browse and inspect Minecraft structures from local modpacks.']
        if (runtimeDir.isPresent()) {
            def runtime = file(runtimeDir.get())
            def info = new Properties(); new File(runtime,'release').withInputStream { info.load(it) }
            if (!info.getProperty('JAVA_VERSION','').startsWith('"21.')) throw new GradleException('viewerRuntimeDir must contain a Java 21 runtime.')
            command += ['--runtime-image', runtime.absolutePath]
        } else {
            command += ['--add-modules', 'java.desktop,java.logging,java.management,jdk.management,jdk.unsupported,jdk.zipfs,jdk.crypto.ec',
                        '--jlink-options', '--strip-debug --no-man-pages --no-header-files']
        }
        commandLine command
    }
}
tasks.register('bundledUpdateNetworkSmoke', Exec) {
    group = 'verification'
    description = 'Checks public GitHub releases and verifies an installer download with the bundled runtime; never starts setup.'
    dependsOn windowsAppImage, testClasses
    def smokeClasspath = files(sourceSets.test.output, fileTree(imageDir.get().dir('app')) { include '*.jar' })
    doFirst {
        commandLine imageDir.get().file('runtime/bin/java.exe').asFile.absolutePath,
                '-cp', smokeClasspath.asPath, 'com.thunder.wildernessodysseyapi.tools.structureviewer.UpdateNetworkSmoke',
                layout.buildDirectory.dir('reports/update-network-smoke').get().asFile.absolutePath
    }
}
tasks.register('windowsInstaller', Exec) {
    group = 'Wilderness Odyssey Tools'
    description = 'Builds a per-user Windows .exe installer; requires WiX 3 tools.'
    dependsOn windowsAppImage
    inputs.dir(imageDir)
    inputs.property('appVersion', appVersion)
    inputs.property('upgradeUuid', upgradeUuid)
    inputs.dir(layout.projectDirectory.dir('src/windows'))
    outputs.file(nativeRoot.map { it.file("installer/${appName}-${appVersion}.exe") })
    outputs.dir(installerWork)
    doFirst {
        def target = nativeRoot.get().file("installer/${appName}-${appVersion}.exe").asFile.canonicalFile.toPath()
        def owner = layout.buildDirectory.get().asFile.canonicalFile.toPath()
        if (!target.startsWith(owner) || target == owner) throw new GradleException('Unsafe installer output path')
        delete(target.toFile())
        def work = installerWork.get().asFile.canonicalFile.toPath()
        if (!work.startsWith(owner) || work == owner) throw new GradleException('Unsafe installer temporary output path')
        delete(work.toFile())
        if (wixDir.isPresent()) environment 'PATH', file(wixDir.get()).absolutePath + File.pathSeparator + System.getenv('PATH')
        commandLine new File(file(packagingJdk.get()), 'bin/jpackage.exe').absolutePath,
                '--type', 'exe', '--name', appName, '--app-version', appVersion,
                '--app-image', imageDir.get().asFile.absolutePath,
                '--dest', nativeRoot.get().dir('installer').asFile.absolutePath,
                '--temp', work.toString(),
                '--resource-dir', layout.projectDirectory.dir('src/windows').asFile.absolutePath,
                '--vendor', 'Wilderness Odyssey', '--description', 'Minecraft modpack structure browser and inspector',
                '--win-per-user-install', '--win-dir-chooser', '--win-menu', '--win-shortcut',
                '--win-menu-group', 'Wilderness Odyssey',
                '--win-upgrade-uuid', upgradeUuid
    }
}
tasks.register('verifyWindowsInstaller', Exec) {
    group = 'verification'
    description = 'Checks the built MSI for older-version detection, replacement, and downgrade protection without installing it.'
    dependsOn windowsInstaller
    doFirst {
        commandLine 'powershell.exe', '-NoProfile', '-NonInteractive', '-File',
                layout.projectDirectory.file('verify-windows-installer.ps1').asFile.absolutePath,
                '-WorkDirectory', installerWork.get().asFile.absolutePath,
                '-Version', appVersion, '-UpgradeCode', upgradeUuid,
                '-ReportFile', nativeRoot.get().file('installer-upgrade-diagnostics.json').asFile.absolutePath
    }
}
tasks.register('verifyWindowsLauncher', Exec) {
    group = 'verification'
    description = 'Launches the native .exe and verifies its bundled runtime without installing it.'
    dependsOn windowsAppImage
    def report = nativeRoot.map { it.file('launcher-diagnostics.json') }
    doFirst {
        delete(report.get().asFile)
        commandLine imageDir.get().file("${appName}.exe").asFile.absolutePath,
                '--diagnostics', report.get().asFile.absolutePath
    }
    doLast {
        def data = new groovy.json.JsonSlurper().parse(report.get().asFile)
        if (data.applicationVersion != appVersion || !data.archiveSupport || !data.desktopSupport || !data.javaVersion.startsWith('21.')
                || !file(data.javaHome).canonicalPath.startsWith(imageDir.get().asFile.canonicalPath)) {
            throw new GradleException('Native launcher did not use a complete bundled Java 21 runtime.')
        }
        logger.lifecycle("Native launcher verified: Java ${data.javaVersion}, archive and desktop support, bundled runtime.")
    }
}
tasks.register('bundledUiSmokeTest', Exec) {
    group = 'verification'
    description = 'Runs viewer UI checks with the packaged application and bundled Java runtime.'
    dependsOn windowsAppImage, testClasses
    // The test driver comes from test output; all application classes and libraries come from the package.
    def smokeClasspath = files(sourceSets.test.output, fileTree(imageDir.get().dir('app')) { include '*.jar' })
    doFirst {
        commandLine imageDir.get().file('runtime/bin/java.exe').asFile.absolutePath, '-Xmx2g',
                '-DstructureViewer.requirePackaged=true',
                "-DstructureViewer.projectDir=${file('../..').absolutePath}",
                "-DstructureViewer.buildDir=${layout.buildDirectory.get().asFile.parentFile.parentFile.absolutePath}",
                "-DstructureViewer.smokeModpack=${providers.gradleProperty('structureViewerSmokeModpack').getOrElse('')}",
                '-cp', smokeClasspath.asPath, 'com.thunder.wildernessodysseyapi.tools.structureviewer.UiSmokeTest',
                layout.buildDirectory.dir('reports/bundled-ui-smoke').get().asFile.absolutePath
    }
}
