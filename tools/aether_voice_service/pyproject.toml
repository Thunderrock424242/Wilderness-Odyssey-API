[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wilderness-aether-voice-service"
version = "0.1.0"
description = "Loopback-only faster-whisper and Kokoro service for Wilderness Odyssey"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "numpy>=1.26,<3.0",
    "soundfile>=0.13,<1.0",
    "faster-whisper>=1.1,<2.0",
    "kokoro>=0.9.4,<1.0",
]

[project.scripts]
aether-voice-service = "aether_voice_service.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aether_voice_service*"]
