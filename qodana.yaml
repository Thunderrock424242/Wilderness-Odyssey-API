---
version: "1.0"
linter: qodana-jvm-community
projectJDK: "21"
profile:
  base:
    name: qodana.starter
  inspections:
    - inspection: AutoCloseableResource
      options:
        # Keep factory-returned resources checked. Only the accessors listed
        # below borrow an existing owner's resource without transferring it.
        ignoreFromMethodCall: "false"
        # MethodMatcher serializes alternating class/method entries in this
        # string option. Escaped line breaks keep each pair free of whitespace.
        # Retain the pinned inspection's eight standard entries first.
        METHOD_MATCHER_CONFIG: "\
          java.util.Formatter,format,\
          java.io.Writer,append,\
          com.google.common.base.Preconditions,checkNotNull,\
          org.hibernate.Session,close,\
          java.io.PrintWriter,printf,\
          java.io.PrintStream,printf,\
          java.lang.foreign.Arena,ofAuto,\
          java.lang.foreign.Arena,global,\
          net.minecraft.world.entity.Entity,level,\
          net.minecraft.server.level.ServerPlayer,serverLevel,\
          net.minecraft.server.MinecraftServer,overworld,\
          net.minecraft.Util,ioPool,\
          com.thunder.wildernessodysseyapi.rendering.backend.RenderBackends,current,\
          com.thunder.wildernessodysseyapi.rendering.backend.RenderBackends.Selection,backend,\
          com.thunder.wildernessodysseyapi.rendering.RenderFrameContext,backend,\
          com.thunder.wildernessodysseyapi.simulation.api.SimulationContext,level,\
          com.thunder.wildernessodysseyapi.vegetation.api.ReactivePlantUpdateContext,level,\
          com.thunder.wildernessodysseyapi.worldupgrade.MigrationContext,level,\
          com.thunder.wildernessodysseyapi.saving.coordinator.SavingCoordinator,level,\
          com.thunder.wildernessodysseyapi.watersystem.water.compat.neoforge.WorldFluidMutationReconciler.StarterTerrainContext,level,\
          com.thunder.wildernessodysseyapi.watersystem.water.compat.neoforge.WaterMutationSafety.LoadedShapeReader,level"

# The Gradle importer references these generated artifacts at their normal build
# paths. Prepare them inside Qodana's disposable checkout before project opening.
bootstrap: |
  set -eu
  ./gradlew :jar :aether-server:jar --no-daemon --no-parallel --max-workers=1 --console=plain
