plugins {
    id 'java'
    id 'application'
}
group = 'com.thunder.aether'
version = '1.0.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
def isolated = providers.gradleProperty('codexBuildDir')
if (isolated.isPresent()) {
    layout.buildDirectory.set(file(isolated.get()))
}
dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.yaml:snakeyaml:2.2'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'com.thunder.aether.server.bootstrap.AetherLauncher' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.named('jar') {
    archiveFileName = 'Aether-Gateway.jar'
    manifest { attributes 'Main-Class': application.mainClass.get() }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
}
tasks.register('verifyStandalone') {
    dependsOn tasks.named('jar')
    doLast {
        def forbidden = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
            it.moduleVersion.id.group.toLowerCase().contains('minecraft') ||
            it.moduleVersion.id.group.toLowerCase().contains('neoforge')
        }
        if (!forbidden.isEmpty()) { throw new GradleException('Minecraft dependency in standalone server') }
        def entries = zipTree(tasks.named('jar').get().archiveFile).matching {
            include 'net/minecraft/**', 'net/neoforged/**'
        }
        if (!entries.isEmpty()) { throw new GradleException('Minecraft classes in standalone server') }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyStandalone') }

tasks.named('test') {
    dependsOn tasks.named('jar')
    doFirst { systemProperty 'aether.jar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath }
}
apply from: 'bundle.gradle'
