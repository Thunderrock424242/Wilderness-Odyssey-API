plugins {
    id 'idea'
    id 'application'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}


tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = "4.2.0"
group = "com.thunder.wildernessodysseyapi"

base {
    archivesName = "wildernessodysseyapi"
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = "21.1.248"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    accessTransformers = project.files('src/main/templates/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            // Keep default (all) so both mod and vanilla GameTests register in dev.
        }

        server {
            server()
            programArgument '--nogui'
            // Keep default (all) so both mod and vanilla GameTests register in dev.
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test commands.
        gameTestServer {
            type = "gameTestServer"
            // Keep automated tests isolated from the developer's normal run/
            // mods and configs so unrelated local mods cannot block startup.
            gameDirectory = project.file('run-gametest')
            // Limit GameTests to our namespace by default so third-party mod tests do not fail the run.
            // Either property can be overridden from the command line, e.g.
            //   -Dforge.enabledGameTestNamespaces=
            //   -Dneoforge.enabledGameTestNamespaces=
            def forgeNamespaces = System.getProperty('forge.enabledGameTestNamespaces')
            def neoforgeNamespaces = System.getProperty('neoforge.enabledGameTestNamespaces')
            def enabledNamespaces = forgeNamespaces != null ? forgeNamespaces : neoforgeNamespaces
            if (enabledNamespaces == null) {
                enabledNamespaces = project.mod_id
            }
            systemProperty 'forge.enabledGameTestNamespaces', enabledNamespaces
            systemProperty 'neoforge.enabledGameTestNamespaces', enabledNamespaces
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Add Minecraft/NeoForge libraries to JUnit and attach src/test output to
    // this mod so FML's transforming class loader can discover the test classes.
    // Access transformers cannot supply missing classes or classpath entries.
    unitTest {
        testedMod = mods."${mod_id}"
        enable()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Reuse the existing empty GameTest template under the mod namespace so the
// generated-water integration tests are included in the normal mod-scoped run.
tasks.named('processResources') {
    from('src/main/resources/data/minecraft/structures/empty.nbt') {
        // 1.21 resource-pack structures use the singular `structure` folder;
        // `structures` is reserved for generated world-save output.
        into 'data/wildernessodysseyapi/structure'
    }
    doLast {
        // The historical test asset is raw NBT, while data-pack structure
        // resources are gzip-compressed. Normalize the copied template in the
        // build output without committing generated binary duplicates.
        def sourceBytes = file('src/main/resources/data/minecraft/structures/empty.nbt').bytes
        def target = file("${destinationDir}/data/wildernessodysseyapi/structure/empty.nbt")
        target.parentFile.mkdirs()
        new java.util.zip.GZIPOutputStream(new FileOutputStream(target)).withCloseable { stream ->
            stream.write(sourceBytes)
        }
    }
}

sourceSets {
    test {
        // NeoForge's JVM test-suite wiring supplies the transformed game
        // libraries but does not currently add this mod's compiled output.
        // Tests must see both production classes and their public signatures.
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    testCompileClasspath.extendsFrom compileClasspath
    // NeoForge unit tests load the mod and therefore need the same externally
    // supplied runtime mods (currently Spark) as runClient/runServer.
    testRuntimeClasspath.extendsFrom localRuntime
    sodiumService {
        canBeConsumed = false
        canBeResolved = true
    }
}

repositories {
    maven {
        url "https://cursemaven.com"
    }
    maven {
        url "https://repo.bluecolored.de/releases"
    }
    maven {
        // Sodium publishes loader-specific developer artifacts here. Restrict
        // the repository so unrelated dependencies keep their normal source.
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"
        content {
            includeGroup "net.caffeinemc"
        }
    }
    maven {
        // Sodium's NeoForge build embeds these Forgified Fabric API modules in
        // its release wrapper; the flattened dev runtime declares them directly.
        name = "Sinytra"
        url = "https://maven.su5ed.dev/releases"
        content {
            includeGroup "org.sinytra.forgified-fabric-api"
        }
    }
}

def sodiumVersion = "0.8.12+mc1.21.1"

// Sodium's published NeoForge release is a bootstrap wrapper whose actual mod
// lives in META-INF/jarjar. Cross-mod mixins are prepared before that nested JAR
// becomes visible, so development runs use the separately published direct mod
// artifact plus a bootstrap-only copy of the wrapper. Player installations
// still use Sodium's normal release JAR.
def sodiumServiceDevJar = tasks.register("sodiumServiceDevJar", Jar) {
    archiveBaseName.set("sodium-service-dev")
    archiveVersion.set(sodiumVersion)
    destinationDirectory.set(layout.buildDirectory.dir("sodium-dev-runtime"))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.sodiumService.collect { zipTree(it) }
    }

    // The direct mod and Forgified modules are normal runtime dependencies.
    // Removing the nested locator prevents the bootstrap from discovering a
    // second copy of those same mods.
    exclude "META-INF/jarjar/**"
    exclude "META-INF/neoforge.mods.toml"
    exclude "META-INF/services/net.neoforged.neoforgespi.locating.IModFileCandidateLocator"
    exclude "META-INF/MANIFEST.MF"
    exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"

    manifest {
        attributes(
                "FMLModType": "LIBRARY",
                "Automatic-Module-Name": "sodium_service"
        )
    }
}

dependencies {

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    implementation "curse.maven:worldedit-225608:5830452"
    implementation "curse.maven:tick-tok-lib-1298954:7547386"
    implementation "curse.maven:create-328085:7963363"
    implementation "curse.maven:regions-unexplored-659110:7826194"
    implementation "curse.maven:lithostitched-936015:7832789"
    implementation "curse.maven:biolith-852512:7074761"
    implementation "curse.maven:terrablender-neoforge-940057:6054947"
    implementation "curse.maven:geckolib-388172:7023453"
    implementation "curse.maven:locate-fixer-1301683:6762552"
    implementation "curse.maven:curios-309927:6529130"
    implementation "curse.maven:amendments-896746:7461027"
    implementation "curse.maven:selene-499980:8261785"
    implementation "curse.maven:supplementaries-412082:8244187"
    implementation "curse.maven:multipart-machines-cooking-885587:5686941"
    implementation "curse.maven:bluemap-406463:6239407"
    localRuntime("net.caffeinemc:sodium-neoforge-mod:${sodiumVersion}") {
        transitive = false
    }
    localRuntime "org.sinytra.forgified-fabric-api:fabric-api-base:0.4.42+d1308ded19"
    localRuntime "org.sinytra.forgified-fabric-api:fabric-renderer-api-v1:3.4.1+9125b6dc19"
    localRuntime "org.sinytra.forgified-fabric-api:fabric-rendering-data-attachment-v1:0.3.48+73761d2e19"
    localRuntime "org.sinytra.forgified-fabric-api:fabric-block-view-api-v2:1.0.10+9afaaf8c19"
    sodiumService("net.caffeinemc:sodium-neoforge:${sodiumVersion}") {
        transitive = false
    }
    clientAdditionalRuntimeClasspath files(sodiumServiceDevJar)
    jarJar(implementation("org.yaml:snakeyaml:2.2")) {
        version {
            strictly '[2.2,3.0)'
            prefer '2.2'
        }
    }
    compileOnly "curse.maven:spark-361579:6225208"
    compileOnly "de.bluecolored:bluemap-api:${bluemap_api_version}"
    localRuntime "curse.maven:spark-361579:6225208"
    // Bundle third-party libraries into the final mod jar (Jar-in-Jar) to avoid missing-class errors at runtime.
    jarJar(implementation('com.squareup.okhttp3:okhttp:4.12.0'))
    jarJar(implementation('com.squareup.okio:okio:3.9.0'))
    jarJar(implementation('io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'))
    jarJar(implementation('com.github.luben:zstd-jni:1.5.7-6'))

    additionalRuntimeClasspath 'org.yaml:snakeyaml:2.2'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : "1.21.1",
            minecraft_version_range: "1.21,1.21.1",
            neo_version            : "21.1.248",
            neo_version_range      : "21.1.248,",
            loader_version_range   : "5.0.3",
            mod_id                 : "wildernessodysseyapi",
            mod_name               : "Wilderness Odyssey API",
            mod_license            : "APR",
            mod_version            : project.version.toString(),
            mod_authors            : "thunderrock424242",
            mod_description        : "a api for my modpack"
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Generates a new version section only when the top-level project version changes.
// Existing marker metadata keeps same-version refreshes on their original Git baseline.
tasks.register('generateChangelog', JavaExec) {
    group = 'documentation'
    description = 'Generates the versioned in-game changelog from committed Git history.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('com.thunder.wildernessodysseyapi.changelog.tool.ChangelogGenerator')
    dependsOn tasks.named('classes')

    doFirst {
        def generatorArgs = [
                '--version',
                providers.gradleProperty('changelogVersion').getOrElse(project.version.toString())
        ]
        if (providers.gradleProperty('changelogFirstRunDays').isPresent()) {
            generatorArgs.addAll('--first-run-days', providers.gradleProperty('changelogFirstRunDays').get())
        }
        if (providers.gradleProperty('changelogOutput').isPresent()) {
            generatorArgs.addAll('--output', providers.gradleProperty('changelogOutput').get())
        }
        if (providers.gradleProperty('changelogDryRun').map { it.toBoolean() }.getOrElse(false)) {
            generatorArgs.add('--dry-run')
        }
        setArgs(generatorArgs)
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
            groupId = 'com.thunder'
            artifactId = 'wildernessodysseyapi'
            version = project.version.toString()
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Thunderrock424242/Wilderness-Odyssey-API")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // ModDev launches from build/minecraft-junit, so repository-oriented tests
    // need the checkout root explicitly instead of relying on user.dir.
    systemProperty 'wildernessodysseyapi.projectDir', layout.projectDirectory.asFile.absolutePath
}

// NeoForge's Windows test setup can expose main output to its transforming
// loader without making that directory discoverable to javac. Compile tests
// against the main JAR while ModDev continues to own the runtime classpath.
tasks.named('compileTestJava', JavaCompile) {
    dependsOn tasks.named('jar')
    classpath = files(tasks.named('jar').flatMap { it.archiveFile }) + classpath
}

// Keep packaging available when the NeoForge/JUnit runtime is unhealthy.
// Tests remain opt-in through `gradlew test` instead of blocking `gradlew build`.
tasks.named('build') {
    setDependsOn([tasks.named('assemble')])
}

tasks.register('profileChunkWorkload', JavaExec) {
    group = 'performance'
    description = 'Executes the chunk workload driver with JFR and optional async-profiler attached.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('com.thunder.wildernessodysseyapi.chunk.ChunkWorkloadDriver')
    dependsOn tasks.named('classes')

    doFirst {
        def profileDir = layout.buildDirectory.dir('reports/profile').get().asFile
        profileDir.mkdirs()
    }

    jvmArgs += [
            "-XX:+UnlockDiagnosticVMOptions",
            "-XX:StartFlightRecording=filename=${layout.buildDirectory.file('reports/profile/chunk-workload.jfr').get().asFile.absolutePath},settings=profile,duration=30s"
    ]

    def asyncProfilerHome = System.getenv('ASYNC_PROFILER_HOME')
    if (asyncProfilerHome) {
        def asyncOutput = layout.buildDirectory.file('reports/profile/chunk-workload-async.svg').get().asFile
        jvmArgs += "-agentpath:${asyncProfilerHome}/build/libasyncProfiler.so=start,event=cpu,file=${asyncOutput.absolutePath}"
    }
}


// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
