plugins {
    id 'idea'
    id 'application'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

// Codex can opt into isolated generated output so Windows locks in the normal
// build directory do not interfere with automated compilation and packaging.
def codexBuildDir = providers.gradleProperty('codexBuildDir')
if (codexBuildDir.isPresent()) {
    def requestedBuildDir = codexBuildDir.get().trim()
    layout.buildDirectory.set(file(requestedBuildDir.isEmpty() ? '.codex-build' : requestedBuildDir))
}

// A deprecation audit is stricter than an ordinary build: Gradle DSL/API
// deprecations fail the same invocation instead of remaining console warnings.
def requestedTaskNames = gradle.startParameter.taskNames.collect { taskPath ->
    taskPath.tokenize(':').last()
}
if (requestedTaskNames.contains('checkDeprecations')) {
    gradle.startParameter.warningMode = org.gradle.api.logging.configuration.WarningMode.Fail
}


tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "wildernessodysseyapi"
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            // Keep default (all) so both mod and vanilla GameTests register in dev.
        }

        server {
            server()
            programArgument '--nogui'
            // Keep default (all) so both mod and vanilla GameTests register in dev.
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test commands.
        gameTestServer {
            type = "gameTestServer"
            // Keep automated tests isolated from the developer's normal run/
            // mods and configs so unrelated local mods cannot block startup.
            gameDirectory = project.file('run-gametest')
            // Limit GameTests to our namespace by default so third-party mod tests do not fail the run.
            // Either property can be overridden from the command line, e.g.
            //   -Dforge.enabledGameTestNamespaces=
            //   -Dneoforge.enabledGameTestNamespaces=
            def forgeNamespaces = System.getProperty('forge.enabledGameTestNamespaces')
            def neoforgeNamespaces = System.getProperty('neoforge.enabledGameTestNamespaces')
            def enabledNamespaces = forgeNamespaces != null ? forgeNamespaces : neoforgeNamespaces
            if (enabledNamespaces == null) {
                enabledNamespaces = project.mod_id
            }
            systemProperty 'forge.enabledGameTestNamespaces', enabledNamespaces
            systemProperty 'neoforge.enabledGameTestNamespaces', enabledNamespaces
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            // Datagen fully registers dependency mods without starting a world. Capture that
            // authoritative registry for the separate offline StructureGen compiler.
            systemProperty 'wildernessodysseyapi.structuregen.catalogOutput', layout.buildDirectory.file(
                    'generated/structuregen/catalog/available-content.json'
            ).get().asFile.absolutePath
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Add Minecraft/NeoForge libraries to JUnit and attach src/test output to
    // this mod so FML's transforming class loader can discover the test classes.
    // Access transformers cannot supply missing classes or classpath entries.
    unitTest {
        testedMod = mods."${mod_id}"
        enable()
    }
}

// Include resources generated by NeoForge data generators and the offline
// StructureGen compiler. StructureGen stays under build/ so its binary output
// cannot be mistaken for a hand-authored source resource.
def structureGenResourceRoot = layout.buildDirectory.dir('generated/structuregen/resources')
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir structureGenResourceRoot
}

// Reuse the existing empty GameTest template under the mod namespace so the
// generated-water integration tests are included in the normal mod-scoped run.
tasks.named('processResources') {
    // Minecraft datagen stores provider hashes beneath its output root. Those
    // local cache records are build bookkeeping, not mod resources.
    exclude '.cache/**'

    from('src/main/resources/data/minecraft/structures/empty.nbt') {
        // 1.21 resource-pack structures use the singular `structure` folder;
        // `structures` is reserved for generated world-save output.
        into 'data/wildernessodysseyapi/structure'
    }
    doLast {
        // The historical test asset is raw NBT, while data-pack structure
        // resources are gzip-compressed. Normalize the copied template in the
        // build output without committing generated binary duplicates.
        def sourceBytes = file('src/main/resources/data/minecraft/structures/empty.nbt').bytes
        def target = file("${destinationDir}/data/wildernessodysseyapi/structure/empty.nbt")
        target.parentFile.mkdirs()
        new java.util.zip.GZIPOutputStream(new FileOutputStream(target)).withCloseable { stream ->
            stream.write(sourceBytes)
        }
    }
}

sourceSets {
    test {
        // NeoForge's JVM test-suite wiring supplies the transformed game
        // libraries but does not currently add this mod's compiled output.
        // Tests must see both production classes and their public signatures.
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    testCompileClasspath.extendsFrom compileClasspath
    // NeoForge unit tests load the mod and therefore need the same externally
    // supplied runtime mods (currently Spark) as runClient/runServer.
    testRuntimeClasspath.extendsFrom localRuntime
    sodiumService {
        canBeConsumed = false
        canBeResolved = true
    }
}

repositories {
    maven {
        url = "https://cursemaven.com"
    }
    maven {
        // Sodium publishes loader-specific developer artifacts here. Restrict
        // the repository so unrelated dependencies keep their normal source.
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"
        content {
            includeGroup "net.caffeinemc"
        }
    }
    maven {
        // Sodium's NeoForge build embeds these Forgified Fabric API modules in
        // its release wrapper; the flattened dev runtime declares them directly.
        name = "Sinytra"
        url = "https://maven.su5ed.dev/releases"
        content {
            includeGroup "org.sinytra.forgified-fabric-api"
        }
    }
}

def sodiumVersion = "0.8.12+mc1.21.1"

// Sodium's published NeoForge release is a bootstrap wrapper whose actual mod
// lives in META-INF/jarjar. Cross-mod mixins are prepared before that nested JAR
// becomes visible, so development runs use the separately published direct mod
// artifact plus a bootstrap-only copy of the wrapper. Player installations
// still use Sodium's normal release JAR.
def sodiumServiceDevJar = tasks.register("sodiumServiceDevJar", Jar) {
    archiveBaseName.set("sodium-service-dev")
    archiveVersion.set(sodiumVersion)
    destinationDirectory.set(layout.buildDirectory.dir("sodium-dev-runtime"))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.sodiumService.collect { zipTree(it) }
    }

    // The direct mod and Forgified modules are normal runtime dependencies.
    // Removing the nested locator prevents the bootstrap from discovering a
    // second copy of those same mods.
    exclude "META-INF/jarjar/**"
    exclude "META-INF/neoforge.mods.toml"
    exclude "META-INF/services/net.neoforged.neoforgespi.locating.IModFileCandidateLocator"
    exclude "META-INF/MANIFEST.MF"
    exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"

    manifest {
        attributes(
                "FMLModType": "LIBRARY",
                "Automatic-Module-Name": "sodium_service"
        )
    }
}

dependencies {

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    implementation "curse.maven:worldedit-225608:5830452"
    implementation "curse.maven:tick-tok-lib-1298954:8685795"
    implementation "curse.maven:create-328085:7963363"
    implementation "curse.maven:regions-unexplored-659110:7826194"
    implementation "curse.maven:lithostitched-936015:7832789"
    implementation "curse.maven:biolith-852512:7074761"
    implementation "curse.maven:terrablender-neoforge-940057:6054947"
    implementation "curse.maven:geckolib-388172:7023453"
    implementation "curse.maven:locate-fixer-1301683:6762552"
    implementation "curse.maven:curios-309927:6529130"
    implementation "curse.maven:amendments-896746:7461027"
    implementation "curse.maven:selene-499980:8261785"
    implementation "curse.maven:supplementaries-412082:8244187"
    implementation "curse.maven:multipart-machines-cooking-885587:5686941"
    // Sodium and its flattened Fabric API support modules are client-only.
    // Keeping them on the client's per-run classpath prevents datagen/server
    // launches from applying Sodium render mixins without its client service.
    clientAdditionalRuntimeClasspath("net.caffeinemc:sodium-neoforge-mod:${sodiumVersion}") {
        transitive = false
    }
    clientAdditionalRuntimeClasspath "org.sinytra.forgified-fabric-api:fabric-api-base:0.4.42+d1308ded19"
    clientAdditionalRuntimeClasspath "org.sinytra.forgified-fabric-api:fabric-renderer-api-v1:3.4.1+9125b6dc19"
    clientAdditionalRuntimeClasspath "org.sinytra.forgified-fabric-api:fabric-rendering-data-attachment-v1:0.3.48+73761d2e19"
    clientAdditionalRuntimeClasspath "org.sinytra.forgified-fabric-api:fabric-block-view-api-v2:1.0.10+9afaaf8c19"
    sodiumService("net.caffeinemc:sodium-neoforge:${sodiumVersion}") {
        transitive = false
    }
    clientAdditionalRuntimeClasspath files(sodiumServiceDevJar)
    jarJar(implementation("org.yaml:snakeyaml:2.2")) {
        version {
            strictly '[2.2,3.0)'
            prefer '2.2'
        }
    }
    compileOnly "curse.maven:spark-361579:6225208"
    localRuntime "curse.maven:spark-361579:6225208"
    // Bundle third-party libraries into the final mod jar (Jar-in-Jar) to avoid missing-class errors at runtime.
    jarJar(implementation('com.squareup.okhttp3:okhttp:4.12.0'))
    jarJar(implementation('com.squareup.okio:okio:3.9.0'))
    jarJar(implementation('io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'))
    jarJar(implementation('com.github.luben:zstd-jni:1.5.7-6'))

    additionalRuntimeClasspath 'org.yaml:snakeyaml:2.2'
}

// Expand release metadata from gradle.properties so dependency ranges and the
// packaged mod identity cannot drift away from the versions used by Gradle.
def generatedModMetadataDir = layout.buildDirectory.dir("generated/sources/modMetadata")
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version       : project.property("minecraft_version").toString(),
            minecraft_version_range : project.property("minecraft_version_range").toString(),
            neo_version             : project.property("neo_version").toString(),
            neo_version_range       : project.property("neo_version_range").toString(),
            loader_version_range    : project.property("loader_version_range").toString(),
            worldedit_version_range : project.property("worldedit_version_range").toString(),
            mod_id                  : project.property("mod_id").toString(),
            mod_name                : project.property("mod_name").toString(),
            mod_license             : project.property("mod_license").toString(),
            mod_version             : project.version.toString(),
            mod_authors             : project.property("mod_authors").toString(),
            mod_description         : project.property("mod_description").toString()
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into generatedModMetadataDir
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata

// NeoForge inspects the main resource roots while preparing Minecraft artifacts.
// Gradle 9 requires the metadata producer to run before that consumer explicitly.
tasks.named("createMinecraftArtifacts").configure {
    dependsOn generateModMetadata
}

// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Generates a new version section only when the top-level project version changes.
// Existing marker metadata keeps same-version refreshes on their original Git baseline.
tasks.register('generateChangelog', JavaExec) {
    group = 'documentation'
    description = 'Generates the versioned in-game changelog from committed Git history.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('com.thunder.wildernessodysseyapi.changelog.tool.ChangelogGenerator')
    dependsOn tasks.named('classes')

    doFirst {
        def generatorArgs = [
                '--version',
                providers.gradleProperty('changelogVersion').getOrElse(project.version.toString())
        ]
        if (providers.gradleProperty('changelogFirstRunDays').isPresent()) {
            generatorArgs.addAll('--first-run-days', providers.gradleProperty('changelogFirstRunDays').get())
        }
        if (providers.gradleProperty('changelogOutput').isPresent()) {
            generatorArgs.addAll('--output', providers.gradleProperty('changelogOutput').get())
        }
        if (providers.gradleProperty('changelogDryRun').map { it.toBoolean() }.getOrElse(false)) {
            generatorArgs.add('--dry-run')
        }
        setArgs(generatorArgs)
    }
}

// StructureGen runs against compiled main classes without depending on
// `classes`, because processResources consumes its generated resource output.
// This avoids the classes -> processResources -> generateStructures -> classes cycle.
def structureGenClasspath = files(sourceSets.main.output.classesDirs) + configurations.runtimeClasspath
def structureGenMainClass = 'com.thunder.wildernessodysseyapi.structuregen.cli.StructureGenCli'
def structureGenBlueprintRoot = layout.projectDirectory.dir('src/main/structure_blueprints')
def structureGenReportRoot = layout.buildDirectory.dir('reports/structuregen')
def structureGenCatalogFile = layout.buildDirectory.file('generated/structuregen/catalog/available-content.json')

// A registry snapshot is safe only for the exact source/dependency environment
// that produced it. Hash project registry inputs, common runtime artifacts, and
// local run/mods content without relying on guessed namespace ownership.
def structureGenProjectFingerprintFiles = files(
        fileTree('src/main/java') { include '**/*.java' },
        fileTree('src/main/resources') { include '**/*' },
        fileTree('src/main/templates') { include '**/*' },
        file('build.gradle'),
        file('settings.gradle'),
        file('gradle.properties')
)
def structureGenRuntimeFingerprintFiles = files(
        configurations.runtimeClasspath,
        fileTree('run/mods') { include '**/*.jar' }
)
def structureGenHashFile = { File source ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    source.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int count
        while ((count = stream.read(buffer)) >= 0) {
            if (count > 0) {
                digest.update(buffer, 0, count)
            }
        }
    }
    java.util.HexFormat.of().formatHex(digest.digest())
}
def structureGenCatalogFingerprint = providers.provider {
    def entries = []
    structureGenProjectFingerprintFiles.files
            .findAll { it.isFile() }
            .each { source ->
                def relativePath = project.relativePath(source).replace('\\', '/')
                entries.add("project:${relativePath}:${structureGenHashFile(source)}")
            }
    structureGenRuntimeFingerprintFiles.files
            .findAll { it.isFile() }
            .each { artifact ->
                entries.add("runtime:${artifact.name}:${structureGenHashFile(artifact)}")
            }
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    entries.sort().each { entry ->
        digest.update(entry.getBytes(java.nio.charset.StandardCharsets.UTF_8))
        digest.update((byte) 10)
    }
    java.util.HexFormat.of().formatHex(digest.digest())
}

// ModDevGradle's run model accepts Provider-backed map entries, so the
// fingerprint is resolved only when the real data launch is prepared.
neoForge.runs.named('data') {
    systemProperties.put(
            'wildernessodysseyapi.structuregen.catalogFingerprint',
            structureGenCatalogFingerprint
    )
}

def generateStructures = tasks.register('generateStructures', JavaExec) {
    group = 'structure generation'
    description = 'Validates JSON structure blueprints and safely compiles Minecraft structure NBT.'
    dependsOn tasks.named('compileJava')
    classpath = structureGenClasspath
    mainClass.set(structureGenMainClass)
    maxHeapSize = '4g'
    inputs.dir structureGenBlueprintRoot
    // The full-registry snapshot is optional so vanilla-only generation still
    // works before runData; when present, its exact contents invalidate output.
    inputs.files(fileTree(layout.buildDirectory.dir('generated/structuregen/catalog')) {
        include 'available-content.json'
    })
    inputs.files structureGenProjectFingerprintFiles
    inputs.files structureGenRuntimeFingerprintFiles
    inputs.property 'catalogEnvironmentFingerprint', structureGenCatalogFingerprint
    // Existing packaged structure sources are collision inputs. A new manual
    // resource must invalidate generation even when no blueprint changed.
    inputs.files(
            fileTree('src/main/resources/data/wildernessodysseyapi/structure') { include '**/*.nbt' },
            fileTree('src/main/resources/data/wildernessodysseyapi/structures') { include '**/*.nbt' },
            fileTree('src/generated/resources/data/wildernessodysseyapi/structure') { include '**/*.nbt' },
            fileTree('src/generated/resources/data/wildernessodysseyapi/structures') { include '**/*.nbt' }
    )
    inputs.file layout.projectDirectory.file('src/main/resources/data/minecraft/structures/empty.nbt')
    outputs.dir structureGenResourceRoot
    // Re-run the safety preflight and semantic re-read for every explicit
    // generation/build invocation instead of trusting a stale UP-TO-DATE result.
    outputs.upToDateWhen { false }

    doFirst {
        setArgs([
                'generate',
                '--project-dir', layout.projectDirectory.asFile.absolutePath,
                '--blueprints', structureGenBlueprintRoot.asFile.absolutePath,
                '--output-resources', structureGenResourceRoot.get().asFile.absolutePath,
                '--catalog', structureGenCatalogFile.get().asFile.absolutePath,
                '--catalog-fingerprint', structureGenCatalogFingerprint.get(),
                '--reports', structureGenReportRoot.get().asFile.absolutePath
        ])
    }
}

tasks.register('inspectStructure', JavaExec) {
    group = 'structure generation'
    description = 'Inspects a Minecraft structure-template NBT and writes text/JSON analysis reports.'
    dependsOn tasks.named('compileJava')
    classpath = structureGenClasspath
    mainClass.set(structureGenMainClass)
    maxHeapSize = '4g'

    doFirst {
        def defaultInput = layout.projectDirectory.file(
                'src/main/resources/data/wildernessodysseyapi/structures/bunker.nbt'
        ).asFile
        def selectedInput = providers.gradleProperty('structureFile')
                .map { file(it) }
                .getOrElse(defaultInput)
        def inspectorArgs = [
                'inspect',
                '--input', selectedInput.absolutePath,
                '--reports', structureGenReportRoot.get().asFile.absolutePath
        ]
        if (providers.gradleProperty('paletteIndex').isPresent()) {
            inspectorArgs.addAll('--palette', providers.gradleProperty('paletteIndex').get())
        }
        setArgs(inspectorArgs)
    }
}

tasks.register('exportStructureBlueprint', JavaExec) {
    group = 'structure generation'
    description = 'Exports supported structure NBT semantics to a human-readable Blueprint v1 JSON file.'
    dependsOn tasks.named('compileJava')
    classpath = structureGenClasspath
    mainClass.set(structureGenMainClass)
    maxHeapSize = '4g'

    doFirst {
        def defaultInput = layout.projectDirectory.file(
                'src/main/resources/data/wildernessodysseyapi/structures/bunker.nbt'
        ).asFile
        def selectedInput = providers.gradleProperty('structureFile')
                .map { file(it) }
                .getOrElse(defaultInput)
        def defaultOutput = structureGenReportRoot.get().file('bunker.blueprint.json').asFile
        def selectedOutput = providers.gradleProperty('blueprintOutput')
                .map { file(it) }
                .getOrElse(defaultOutput)
        setArgs([
                'export',
                '--input', selectedInput.absolutePath,
                '--output', selectedOutput.absolutePath
        ])
    }
}

tasks.register('compareStructures', JavaExec) {
    group = 'structure generation'
    description = 'Compares two Minecraft structure-template NBT files semantically.'
    dependsOn tasks.named('compileJava')
    classpath = structureGenClasspath
    mainClass.set(structureGenMainClass)
    maxHeapSize = '4g'

    doFirst {
        if (!providers.gradleProperty('leftStructure').isPresent()
                || !providers.gradleProperty('rightStructure').isPresent()) {
            throw new GradleException('compareStructures requires -PleftStructure=<path> and -PrightStructure=<path>.')
        }
        setArgs([
                'compare',
                '--left', file(providers.gradleProperty('leftStructure').get()).absolutePath,
                '--right', file(providers.gradleProperty('rightStructure').get()).absolutePath
        ])
    }
}

// A direct runData invocation must be able to create the registry snapshot from
// a clean checkout before mod-aware blueprints can validate against it. Keep
// that catalog-refresh invocation single-purpose; every normal resource,
// packaging, and development invocation retains the generation gate below.
def refreshingStructureGenCatalog = requestedTaskNames == ['runData']

// Every packaged or development resource set is regenerated from validated
// blueprints, preventing stale generated NBT from entering a release artifact.
tasks.named('processResources') {
    if (!refreshingStructureGenCatalog) {
        dependsOn generateStructures
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
            groupId = 'com.thunder'
            artifactId = 'wildernessodysseyapi'
            version = project.version.toString()
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Thunderrock424242/Wilderness-Odyssey-API")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Compile production sources into a disposable, non-packaged destination with
// javac's detailed deprecation categories enabled. -Werror turns each use of a
// deprecated API (including one marked for removal) into a verification failure.
tasks.register('checkDeprecations', JavaCompile) {
    group = 'verification'
    description = 'Fails on deprecated Java API usage or deprecated Gradle build logic.'
    source(sourceSets.main.java)
    classpath = sourceSets.main.compileClasspath
    destinationDirectory.set(layout.buildDirectory.dir('classes/java/deprecationCheck'))
    options.compilerArgs.addAll([
            '-Xlint:deprecation',
            '-Xlint:removal',
            '-Werror'
    ])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // ModDev launches from build/minecraft-junit, so repository-oriented tests
    // need the checkout root explicitly instead of relying on user.dir.
    systemProperty 'wildernessodysseyapi.projectDir', layout.projectDirectory.asFile.absolutePath
    doFirst {
        // Packaging regressions must inspect the exact JAR produced by this
        // invocation, including isolated -PcodexBuildDir outputs.
        systemProperty 'wildernessodysseyapi.jarPath', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    }
}

// The release contract test inspects the exact processed artifact rather than
// source templates, so the ordinary test lifecycle must produce that JAR first.
tasks.named('test').configure {
    dependsOn tasks.named('jar')
}

// junit-fml installs a global LauncherSession listener that boots every mod.
// Remove only that adapter; ordinary JUnit and the Minecraft libraries remain.
def structureGenOfflineRuntime = files(
        sourceSets.test.output,
        sourceSets.main.output,
        configurations.testRuntimeClasspath.filter { !it.name.startsWith('junit-fml-') }
)

tasks.register('structureGenTest', Test) {
    group = 'verification'
    description = 'Runs focused StructureGen tests without starting Minecraft or loading project mods.'
    dependsOn tasks.named('compileTestJava')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = structureGenOfflineRuntime
    maxHeapSize = '1g'
    filter {
        includeTestsMatching 'com.thunder.wildernessodysseyapi.structuregen.*'
    }
}

tasks.register('aiTest', Test) {
    group = 'verification'
    description = 'Runs focused A.E.T.H.E.R logic tests without starting Minecraft or loading project mods.'
    dependsOn tasks.named('compileTestJava')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = structureGenOfflineRuntime
    filter {
        includeTestsMatching 'com.thunder.wildernessodysseyapi.ai.*'
    }
}

tasks.register('structureGenBunkerTest', Test) {
    group = 'verification'
    description = 'Runs the memory-intensive read-only bunker fixture regression.'
    dependsOn tasks.named('compileTestJava')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = structureGenOfflineRuntime
    maxHeapSize = '4g'
    systemProperty 'structuregen.runBunkerRegression', 'true'
    filter {
        includeTestsMatching 'com.thunder.wildernessodysseyapi.structuregen.nbt.BunkerStructureRegressionTest'
    }
}

// NeoForge's Windows test setup can expose main output to its transforming
// loader without making that directory discoverable to javac. Compile tests
// against the main JAR while ModDev continues to own the runtime classpath.
tasks.named('compileTestJava', JavaCompile) {
    dependsOn tasks.named('jar')
    classpath = files(tasks.named('jar').flatMap { it.archiveFile }) + classpath
}

// Keep packaging available when the NeoForge/JUnit runtime is unhealthy.
// Tests remain opt-in through `gradlew test` instead of blocking `gradlew build`.
tasks.named('build') {
    setDependsOn([tasks.named('assemble')])
}

tasks.register('profileChunkWorkload', JavaExec) {
    group = 'performance'
    description = 'Executes the chunk workload driver with JFR and optional async-profiler attached.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('com.thunder.wildernessodysseyapi.chunk.ChunkWorkloadDriver')
    dependsOn tasks.named('classes')

    doFirst {
        def profileDir = layout.buildDirectory.dir('reports/profile').get().asFile
        profileDir.mkdirs()
    }

    jvmArgs += [
            "-XX:+UnlockDiagnosticVMOptions",
            "-XX:StartFlightRecording=filename=${layout.buildDirectory.file('reports/profile/chunk-workload.jfr').get().asFile.absolutePath},settings=profile,duration=30s"
    ]

    def asyncProfilerHome = System.getenv('ASYNC_PROFILER_HOME')
    if (asyncProfilerHome) {
        def asyncOutput = layout.buildDirectory.file('reports/profile/chunk-workload-async.svg').get().asFile
        jvmArgs += "-agentpath:${asyncProfilerHome}/build/libasyncProfiler.so=start,event=cpu,file=${asyncOutput.absolutePath}"
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
